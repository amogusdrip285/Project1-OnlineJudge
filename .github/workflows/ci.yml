name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oj
          POSTGRES_PASSWORD: oj
          POSTGRES_DB: oj_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://oj:oj@localhost:5432/oj_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov=scripts --cov-report=term-missing --cov-fail-under=80

  # B and C: add `judge` and `frontend` jobs here once your folders have tests.

  compose:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8000/api/health
      # Until B's real judge is merged, the fake judge marks submissions AC so the smoke test
      # can run. B: delete this step when judge/ judges for real (never run both together).
      - name: Start fake judge (temporary)
        run: docker compose exec -d backend python -m scripts.fake_judge
      - name: Smoke test (login -> submit A+B -> AC -> points)
        run: python3 scripts/smoke_test.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
