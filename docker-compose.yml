services:
  db:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [default, internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data/problems:/data/problems"]
    depends_on:
      db: { condition: service_healthy }
    networks: [default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  judge:
    build: ./judge
    env_file: .env
    volumes: ["./data/problems:/data/problems:ro"]
    depends_on:
      backend: { condition: service_healthy } # backend runs the migrations
    networks: [internal] # only reaches db, never the internet
    mem_limit: 1g
    pids_limit: 256

  frontend:
    build: ./frontend
    env_file: .env
    ports: ["5173:5173"]

networks:
  internal:
    internal: true

volumes:
  pgdata:
