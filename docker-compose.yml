services:
  db:
    image: postgres:16
    env_file: .env
    # Loopback only: never expose the DB on the network. Connect with 127.0.0.1, not `localhost`
    # (on Windows `localhost` tries IPv6 ::1 first and hangs).
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [default, internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - problems:/data/problems # named volume: writable by the non-root backend user
      - ./data/seed:/data/seed:ro # seed problems, read by scripts/seed.py
    depends_on:
      db: { condition: service_healthy }
    networks: [default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  judge:
    build: ./judge
    env_file: .env
    volumes: ["problems:/data/problems:ro"]
    depends_on:
      backend: { condition: service_healthy } # backend runs the migrations
    networks: [internal] # only reaches db, never the internet
    mem_limit: 1g
    pids_limit: 256

  frontend:
    build: ./frontend
    env_file: .env
    ports: ["5173:5173"]

networks:
  internal:
    internal: true

volumes:
  pgdata:
  problems:
